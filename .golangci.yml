version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - errname
    - errorlint
    - gocritic
    - ineffassign
    - misspell
    - nolintlint
    - unused
  settings:
    errorlint:
      comparison: false
      asserts: false
    gocritic:
      disabled-checks:
        - ifElseChain
    misspell:
      locale: US
  exclusions:
    rules:
      - text: non-wrapping format verb for fmt.Errorf
        linters:
          - errorlint
    paths:
      - playground
      - docs
      - scripts
      - stapel

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/werf/)
    gofumpt:
      extra-rules: true
  exclusions:
    paths:
      - playground
      - docs
      - scripts
      - stapel

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
